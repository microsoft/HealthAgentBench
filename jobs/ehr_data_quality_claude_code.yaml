jobs_dir: results/harbor/mimic_iv_dq_claude_code
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 1
quiet: false

environment:
  type: docker
  # Each task's Dockerfile runs an internet download from PhysioNet at build
  # time and applies the corruption recipe locally. force_build keeps the
  # build deterministic against newer demo versions.
  force_build: true
  delete: true

agents:
  - import_path: medcli.agents.harbor.installed.claude_code:ClaudeCode
    model_name: claude-opus-4-7
    kwargs:
      effort_level: medium

metrics:
  - type: uv-script
    kwargs:
      script_path: scripts/mimic_iv_dq/aggregate_metric.py

datasets:
  - path: tasks/mimic_iv_dq
    task_names:
      - "task_*"

artifacts:
  - /workspace/submission/flagged_rows.csv
  - /logs/verifier/metrics.json
  - /logs/verifier/reward.json

jobs_dir: results
n_attempts: 1
timeout_multiplier: 1.0
# Docker's default network-address pool gives ~31 bridge networks before
# exhaustion. Each Harbor trial creates one compose network, so keep the
# concurrency below that ceiling (with headroom if multiple Harbor jobs
# run against the same daemon). See scripts/mimic_report_gen/README.md
# "Validation Commands" note for details.
n_concurrent_trials: 15
quiet: false

environment:
  type: docker
  # Reuse cached buildx layers (torch + transformers + CheXbert weights
  # take ~5 min to build from scratch; cache rebuild is ~5 s). Flip to
  # true only when iterating on the Dockerfile.
  force_build: false
  delete: true

agents:
  - import_path: medcli.agents.harbor.installed.codex:Codex
    model_name: gpt-5.3-codex
    kwargs:
      reasoning_effort: medium

metrics:
  # The aggregator reads per-trial CheXbert label scalars from each
  # trial's reward.json and computes pooled F1 / accuracy via sklearn.
  - type: uv-script
    kwargs:
      script_path: scripts/mimic_report_gen/aggregate_metric.py

datasets:
  # "*" runs every patient subtask under tasks/mimic_report_gen/. To
  # target a specific patient for debugging, replace with the exact
  # subtask name, e.g.  task_names: [p10046166_s50051329]
  - path: tasks/mimic_report_gen
    task_names:
      - "*"

artifacts:
  - /workspace/submission.json

jobs_dir: results/harbor/ehrsql_eicu_valid
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  force_build: true
  delete: true
  env:
    - CODEX_AUTH_JSON=${CODEX_AUTH_JSON}

agents:
  - import_path: medcli.agents.harbor.installed.codex:Codex
    model_name: gpt-5.1-codex
    kwargs:
      reasoning_effort: medium

datasets:
  - path: tasks
    task_names:
      - ehrsql_eicu_valid
artifacts:
  - /workspace/submission.json

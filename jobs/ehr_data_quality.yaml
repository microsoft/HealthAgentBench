jobs_dir: results/harbor/ehr_data_quality
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 2
quiet: false

environment:
  type: docker
  # Each task's Dockerfile runs an internet download from PhysioNet at build
  # time and applies the corruption recipe locally. force_build keeps the
  # build deterministic against newer demo versions.
  force_build: true
  delete: true

agents:
  - import_path: medcli.agents.harbor.installed.codex:Codex
    model_name: gpt-5.5
    kwargs:
      reasoning_effort: medium

metrics:
  - type: uv-script
    kwargs:
      script_path: scripts/ehr_data_quality/aggregate_metric.py

datasets:
  - path: tasks/ehr_data_quality
    task_names:
      - "task_*"

artifacts:
  - /workspace/submission/flagged_rows.csv
  - /logs/verifier/metrics.json
  - /logs/verifier/reward.json

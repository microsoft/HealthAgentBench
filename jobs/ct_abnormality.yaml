jobs_dir: results/harbor/ct_abnormality
n_attempts: 1
timeout_multiplier: 1.0
n_concurrent_trials: 2
quiet: false

environment:
  type: docker
  # Each task's two-service compose stages its volume via a one-shot `bootstrap`
  # service: on cache miss it pulls the volume from Hugging Face (CT-RATE is
  # OpenRAIL-gated; HF_TOKEN comes from the repo-root .env via env_file) into the
  # repo-relative cache scripts/ct_abnormality/assets/raw_cache/, derives the
  # per-volume gold from the report, and stages scan.nii.gz + labels.txt into a
  # shared workspace volume. `main` depends_on bootstrap completing successfully,
  # so Harbor's `docker compose up --wait` starts the agent only once data is staged.
  force_build: true
  delete: true

agents:
  - import_path: medcli.agents.harbor.installed.codex:Codex
    model_name: gpt-5.5
    kwargs:
      reasoning_effort: medium
  - import_path: medcli.agents.harbor.installed.claude_code:ClaudeCode
    model_name: claude-opus-4-7
    kwargs:
      reasoning_effort: medium

metrics:
  - type: uv-script
    kwargs:
      script_path: scripts/ct_abnormality/aggregate_metric.py

datasets:
  - path: tasks/ct_abnormality
    task_names:
      - "valid_*"

artifacts:
  - /workspace/submission/predictions.txt
  - /workspace/data/labels.txt
  - /logs/verifier/metrics.json
  - /logs/verifier/reward.json

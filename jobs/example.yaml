jobs_dir: results
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  force_build: true
  delete: true

agents:
  # - import_path: medcli.agents.harbor.installed.codex:Codex
  #   model_name: gpt-5.4-mini
  #   kwargs:
  #     reasoning_effort: medium
  - import_path: medcli.agents.harbor.installed.copilot_cli:CopilotCli
    model_name: gpt-5.4-mini
    kwargs:
      reasoning_effort: medium

datasets:
  # - path: examples/tasks
  #   task_names:
  #     - hello-world
  - registry: {}
    name: hello-world
    version: "1.0"
    task_names:
      - hello-world

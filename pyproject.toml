[project]
name = "medcli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheng Zhang", email = "shezhan@microsoft.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "anthropic>=0.84.0",
    "azure-identity>=1.25.1",
    "backoff>=2.2.1",
    "beautifulsoup4>=4.14.3",
    "biopython>=1.86",
    "duckdb>=1.5.2",
    "fhir-resources>=8.2.0",
    "filelock>=3.25.0",
    "func-timeout>=4.3.5",
    "gdown>=5.2.1",
    "harbor==0.8.0",
    "imagecodecs>=2026.1.1",
    "jinja2>=3.1.6",
    "lifelines>=0.30.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "openai>=2.24.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "presidio-analyzer>=2.2.361",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pytrec-eval>=0.5",
    "pyyaml>=6.0.3",
    "remotezip>=0.12.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.48",
    "sqlparse>=0.5.5",
    "tenacity>=9.1.4",
    "tiktoken>=0.12.0",
    "tifffile>=2025.5.10",
    "tqdm>=4.67.1",
    "huggingface-hub>=1.6.0",
    "nibabel>=5.4.2",
    "pillow>=12.1.1",
    "redivis>=0.20.7",
    "lightgbm>=4.6.0",
]

[project.scripts]
medcli = "medcli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medcli*", "scripts*"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["results", ".venv", "__pycache__"]
markers = [
    "integration: marks tests that require external services such as Dockerized FHIR runtime",
]

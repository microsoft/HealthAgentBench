# Per-task configuration for the clinical_trial_matching benchmark.
#
# Source-name obfuscation: the agent-visible artifacts must not say "TREC"
# or "ClinicalTrials.gov". This file (and the assets/ tree as a whole) is
# verifier-side only.
#
# Each task focuses on a single TREC-CT 2021 topic (a synthetic patient
# admission note). The judged-pool corpus for that topic — every clinical
# trial NCT ID with a qrels judgment for the topic — is fetched at Docker
# build time via HTTP range requests against the TREC snapshot zip files
# (see scripts/clinical_trial_matching/fetch_trials.py). Repo-side, only the topic
# text, NCT-id list, and qrels slice are written into tasks/.

# Selection rationale: stratified across 10 clinical specialties (oncology /
# neurology / cardiovascular / renal / pulmonary / endocrine / autoimmune /
# pediatric neurology / GI-liver / hematology); ages 15–70; both sexes;
# every selected topic has >= 50 judged-eligible trials and >= 400 total
# judged trials in the qrels.
selected_topics:
  - 8     # 57M, CLL with Richter's transformation (oncology)
  - 75    # 55M, Parkinson's disease (neurology)
  - 19    # 65M, CAD/MI/VT, ICD candidate (cardiovascular)
  - 6     # 55F, ESRD on HD with recurrent C. diff (renal + infectious)
  - 14    # 70 y/o, COPD + OSA + obesity hypoventilation (pulmonary)
  - 29    # 24M, T1DM x11 yr (endocrine)
  - 26    # 45F, autoimmune w/ abdominal pain (rheumatology)
  - 35    # 15F, recurrent bilateral migraines (pediatric neurology)
  - 27    # 53M, chronic HCV x2 yr (GI / hepatology)
  - 45    # 34M, sickle cell disease (hematology)

# Upstream resources fetched once into assets/raw_cache/ (gitignored).
upstream:
  topics_url: https://trec.nist.gov/data/trials/topics2021.xml
  qrels_url:  https://trec.nist.gov/data/trials/qrels2021.txt

  # 5 zip parts hosting the April 27, 2021 ClinicalTrials.gov snapshot.
  # Each part is ~280-365 MB; we fetch only specific NCT XMLs via HTTP
  # range requests (remotezip) at Docker build time.
  corpus_zip_urls:
    - https://www.trec-cds.org/2021_data/ClinicalTrials.2021-04-27.part1.zip
    - https://www.trec-cds.org/2021_data/ClinicalTrials.2021-04-27.part2.zip
    - https://www.trec-cds.org/2021_data/ClinicalTrials.2021-04-27.part3.zip
    - https://www.trec-cds.org/2021_data/ClinicalTrials.2021-04-27.part4.zip
    - https://www.trec-cds.org/2021_data/ClinicalTrials.2021-04-27.part5.zip

  # The TREC server returns HTTP 406 to clients with the requests stdlib
  # default User-Agent. Always send a non-empty UA.
  user_agent: clinical_trial_matching/1.0 (medcli benchmark)

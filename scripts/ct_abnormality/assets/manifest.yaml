# CT-RATE 10-volume manifest for the MedCLI ct_abnormality benchmark.
#
# This file pins the 10 CT volumes (from the CT-RATE validation split) that make
# up the benchmark. It deliberately contains NO gold labels and NO report text:
# the gold for each volume is re-derived at task-bootstrap time from the volume's
# paired radiology report using the phrase rules in
# `scripts/ct_abnormality/gold_derivation.py`. Keeping only volume IDs here (and
# the phrase rules in code) avoids redistributing the gated CT-RATE reports or
# the answer key while keeping the benchmark fully reproducible.
#
# `bucket` is informational stratification metadata (label-density stratum the
# volume was chosen for) and carries no answer-key information.
#
# Source split: dataset/valid_fixed/<patient>/<study>/<volume>.nii.gz
# License: OpenRAIL (gated). See scripts/ct_abnormality/README.md for access setup.

# Hugging Face dataset repo, volume split prefix, and the report CSV the
# bootstrap downloads to derive gold at runtime.
hf_repo: ibrahimhamamci/CT-RATE
hf_split_root: dataset/valid_fixed
hf_reports_path: dataset/radiology_text_reports/validation_reports.csv

# The 17 evaluated abnormality categories live in gold_derivation.FINDINGS
# (the phrase-rule schema); they are intentionally not duplicated here.

volumes:
  - {volume_name: valid_670_a_1.nii.gz, bucket: normal}
  - {volume_name: valid_304_a_1.nii.gz, bucket: light}
  - {volume_name: valid_81_a_1.nii.gz, bucket: light}
  - {volume_name: valid_16_a_1.nii.gz, bucket: light}
  - {volume_name: valid_137_a_1.nii.gz, bucket: moderate}
  - {volume_name: valid_481_a_2.nii.gz, bucket: moderate}
  - {volume_name: valid_636_a_1.nii.gz, bucket: moderate}
  - {volume_name: valid_265_a_2.nii.gz, bucket: moderate}
  - {volume_name: valid_46_a_1.nii.gz, bucket: heavy}
  - {volume_name: valid_144_a_1.nii.gz, bucket: heavy}

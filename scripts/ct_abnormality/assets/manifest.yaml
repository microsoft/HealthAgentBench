# CT-RATE 10-volume manifest for the MedCLI ct_abnormality benchmark.
#
# This file is the canonical contract that scripts/ct_abnormality/generate_harbor_tasks.py
# turns into 10 Harbor task directories under tasks/ct_abnormality/. Each entry pins
# one CT volume from the CT-RATE validation split, the bucket (label-density
# stratum), and the labels we evaluate on that volume. Each label has a `gold`
# value (1 = positive finding present, 0 = explicitly negated) and an `evidence`
# quote — the verbatim excerpt from the paired radiology report that justifies
# the value.
#
# Labels NOT listed for a volume are dropped from that volume's gold; the
# verifier will not score them. This is the strict report-derived gold set
# documented in `.agent/plans/ct_abnormality.md`.
#
# Of the 18 CT-RATE abnormality categories, 17 are evaluated (Pulmonary fibrotic
# sequela was dropped because no volume retained it under the strict-wording
# rule).
#
# Source split: dataset/valid_fixed/<patient>/<study>/<volume>.nii.gz
# License: OpenRAIL (gated). See scripts/ct_abnormality/README.md for access setup.

# Hugging Face dataset repo and split prefix we resolve volumes from.
hf_repo: ibrahimhamamci/CT-RATE
hf_split_root: dataset/valid_fixed

# Categories evaluated by the verifier (17). The 18th CT-RATE category,
# "Pulmonary fibrotic sequela", is intentionally absent.
evaluated_labels:
  - Medical material
  - Arterial wall calcification
  - Cardiomegaly
  - Pericardial effusion
  - Coronary artery wall calcification
  - Hiatal hernia
  - Lymphadenopathy
  - Emphysema
  - Atelectasis
  - Lung nodule
  - Lung opacity
  - Pleural effusion
  - Mosaic attenuation pattern
  - Peribronchial thickening
  - Consolidation
  - Bronchiectasis
  - Interlobular septal thickening

volumes:
  - task_id: valid_670_a_1
    volume_name: valid_670_a_1.nii.gz
    bucket: normal
    labels:
      - {name: Cardiomegaly, gold: 0, evidence: "Heart dimensions and compartments appear natural."}
      - {name: Pericardial effusion, gold: 0, evidence: "Pericardial effusion was not detected."}
      - {name: Lymphadenopathy, gold: 0, evidence: "No lymph node was observed in the supraclavicular fossa and axilla in pathological size and appearance."}
      - {name: Lung nodule, gold: 0, evidence: "no nodular or infiltrative lesion is detected in the lung parenchyma"}

  - task_id: valid_304_a_1
    volume_name: valid_304_a_1.nii.gz
    bucket: light
    labels:
      - {name: Cardiomegaly, gold: 0, evidence: "heart contour, size are normal"}
      - {name: Pericardial effusion, gold: 0, evidence: "Pericardial effusion-thickening was not observed."}
      - {name: Lymphadenopathy, gold: 0, evidence: "No enlarged lymph nodes in prevascular, pre-paratracheal, subcarinal or bilateral hilar-axillary pathological dimensions were detected."}
      - {name: Lung opacity, gold: 1, evidence: "patchy ground glass densities are observed in crazy paving pattern"}

  - task_id: valid_81_a_1
    volume_name: valid_81_a_1.nii.gz
    bucket: light
    labels:
      - {name: Cardiomegaly, gold: 0, evidence: "heart contour, size are normal"}
      - {name: Pericardial effusion, gold: 0, evidence: "Pericardial effusion-thickening was not observed."}
      - {name: Lymphadenopathy, gold: 0, evidence: "No enlarged lymph nodes in prevascular, pre-paratracheal, subcarinal or bilateral hilar-axillary pathological dimensions were detected."}
      - {name: Emphysema, gold: 1, evidence: "Subpleural emphysema areas in paraseptal-centracinar style are observed in both lungs"}
      - {name: Lung nodule, gold: 1, evidence: "there are nonspecific millimetric nodules in both lungs"}

  - task_id: valid_16_a_1
    volume_name: valid_16_a_1.nii.gz
    bucket: light
    labels:
      - {name: Cardiomegaly, gold: 0, evidence: "heart contour, size are normal"}
      - {name: Pericardial effusion, gold: 0, evidence: "Pericardial effusion-thickening was not observed."}
      - {name: Lymphadenopathy, gold: 0, evidence: "No enlarged lymph nodes in prevascular, pre-paratracheal, subcarinal or bilateral hilar-axillary pathological dimensions were detected."}
      - {name: Lung opacity, gold: 1, evidence: "ground glass areas ... in the left lung lower lobe anteromediobasal segment"}
      - {name: Consolidation, gold: 1, evidence: "nodular consolidation areas in the left lung lower lobe anteromediobasal segment"}

  - task_id: valid_137_a_1

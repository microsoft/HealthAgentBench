# Per-task configuration for the ehr_data_quality benchmark.
# Four families, one task per family. Each task applies all sub-variants of
# its family. Counts are per-(family, table) call. Recall is cluster-based
# (see harbor_evaluator.py). Task IDs are informative labels.

tasks:
  - id: task_impossible_value
    seed: 0
    in_scope_patient_count: 20
    tables: [labevents, chartevents, prescriptions]
    injectors:
      # Sub-types: range_extreme, decimal_shift (in-range only),
      # decimal_shift_rx, unit_confusion, valueuom_mismatch.
      - {family: impossible_value, count: 12}

  - id: task_inconsistency
    seed: 2
    in_scope_patient_count: 20
    tables: [labevents, chartevents]
    injectors:
      # Two sub-types: in_table_conflict (cluster = 2 rows in the same
      # table, same key fields, disagreeing valuenum) and cross_table_conflict
      # (cluster spans labevents and chartevents for the same measurement at
      # the same charttime, with valuenum disagreeing by 50%). Either row in
      # a cluster catches it.
      - {family: inconsistency, count: 16}

  - id: task_demographic_conflict
    seed: 3
    # Marker drugs (Tamoxifen/Estrogen for F, Tamsulosin/Finasteride for M,
    # Donepezil for geriatric) are sparse in the 100-patient demo. Setting
    # in_scope to 100 makes every marker-drug carrier eligible so we can
    # surface both gender_drug_mismatch directions plus age_drug_mismatch.
    in_scope_patient_count: 100
    tables: [patients]
    injectors:
      # Sub-types: gender_drug_mismatch (flip gender for a patient on a
      # gender-specific drug — both F→M and M→F directions) and
      # age_drug_mismatch (rewrite anchor_age to 5 for a geriatric-drug
      # carrier). Cluster spans patients + the evidence prescription row.
      - {family: demographic_conflict, count: 18}

  - id: task_combined
    # Layered task: each injector below re-uses its standalone parent's
    # seed / in_scope_patient_count / tables triple verbatim, so this task's
    # labels.csv is the literal union of task_impossible_value +
    # task_inconsistency + task_demographic_conflict (modulo zero or a small
    # number of collision drops, reported to stderr at generation time).
    # Task-level seed / in_scope_patient_count are unused when every injector
    # supplies its own — kept for schema-validation safety. Injector order
    # is collision priority: earlier-in-list wins on (table, row_id, field).
    # See .agent/plans/task_combined_exact_layering.md for the design.
    seed: 0
    in_scope_patient_count: 100
    tables: [labevents, chartevents, prescriptions, patients]
    injectors:
      - {family: impossible_value,     count: 12, seed: 0, in_scope_patient_count: 20,  tables: [labevents, chartevents, prescriptions]}
      - {family: inconsistency,        count: 16, seed: 2, in_scope_patient_count: 20,  tables: [labevents, chartevents]}
      - {family: demographic_conflict, count: 18, seed: 3, in_scope_patient_count: 100, tables: [patients]}

# subtype_views removed: the suite is now four parent-level tasks only —
# task_impossible_value, task_inconsistency, task_demographic_conflict, and
# task_combined (the layered union of the three). The per-subtype "view"
# tasks were dropped because the four parents already cover every subtype,
# and view-task pass rates were saturating at the easier subtypes without
# giving signal on the harder ones. ``generate_harbor_tasks.py`` reads
# ``subtype_views`` via ``raw_yaml.get("subtype_views", []) or []`` so the
# missing key is handled gracefully.

version = "1.0"
artifacts = ["/workspace/submission/predictions.txt"]

[metadata]
benchmark = "ct_abnormality"
mode = "etl-task"
task_id = "ct_abnormality_valid_636_a_1"
submission_path = "/workspace/submission/predictions.txt"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024

[agent]
timeout_sec = 3600.0
# Agent phase: only the model APIs are reachable (Harbor egress-control sidecar,
# SNI/IP allowlist). Environment setup stays public so agent CLIs can install.
network_mode = "allowlist"
allowed_hosts = [
  "chatgpt.com", "*.chatgpt.com",
  "openai.com", "*.openai.com",
  "openai.azure.com", "*.openai.azure.com",
  "anthropic.com", "*.anthropic.com",
]

[environment]
build_timeout_sec = 1800.0
# Setup baseline is public; the agent phase is allowlisted (see [agent]).
network_mode = "public"
cpus = 2
memory_mb = 8192
storage_mb = 8192
gpus = 0
mcp_servers = []

[verifier.env]

[solution.env]

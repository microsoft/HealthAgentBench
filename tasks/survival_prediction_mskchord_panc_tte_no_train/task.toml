version = "1.0"

[metadata]
benchmark = "survival_prediction"
mode = "etl-task"
task_id = "survival_prediction_mskchord_panc_tte_no_train"
dataset = "mskchord"
cohort = "panc"
prediction_task = "TTE_OS"
training_data = false
submission_path = "/workspace/submission/predictions.csv"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 1
memory_mb = 2048
storage_mb = 2048

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = [
  "chatgpt.com", "*.chatgpt.com",
  "openai.com", "*.openai.com",
  "anthropic.com", "*.anthropic.com",
]

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 16
memory_mb = 32768
storage_mb = 32768
gpus = 0
mcp_servers = []

[verifier.env]

[solution.env]

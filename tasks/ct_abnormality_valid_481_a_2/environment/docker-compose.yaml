services:
  main:
    build:
      context: ..
      dockerfile: environment/Dockerfile
    image: ${COMPOSE_PROJECT_NAME}-img
    volumes:
      - workspace-data:/workspace/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME}-img
    env_file:
      # HF_TOKEN (CT-RATE is OpenRAIL-gated) lives here. Other vars in .env
      # are loaded harmlessly. Only bootstrap reads .env, so the token never
      # reaches main / the agent.
      - ../../../.env
    volumes:
      # bootstrap.sh + gold_derivation.py are bind-mounted into the bootstrap
      # service ONLY (not baked into the image), so the agent's main container
      # can never read them — they name the CT-RATE source / HF report path and
      # hold the gold-derivation recipe.
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./gold_derivation.py:/opt/gold_derivation.py:ro
      # Repo-relative shared NIfTI + report cache (RW so bootstrap can populate
      # on a cache miss). Resolves to assets/ct_abnormality/assets/raw_cache.
      - ../../../assets/ct_abnormality/assets/raw_cache:/data/_cache:rw
      # Per-task tests/ dir, RW: bootstrap writes the runtime-derived gold.json
      # here (gitignored). Harbor builds the separate verifier image from this
      # dir at verification time (tests/Dockerfile copies gold.json). main does
      # NOT mount this — the agent never sees the gold.
      - ../tests:/tests:rw
      - workspace-data:/workspace/data
    # Explicit networking keeps bootstrap outside Harbor's egress control: it must
    # reach upstream sources on a cache miss, and no agent code runs in it.
    networks:
      - default
    command: ["/bin/bash", "/bootstrap.sh"]

volumes:
  workspace-data:

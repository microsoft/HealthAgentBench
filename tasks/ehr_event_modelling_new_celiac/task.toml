version = "1.0"
artifacts = ["/workspace/submission/predictions.csv"]

[metadata]
benchmark = "ehr_event_modelling"
mode = "etl-task"
task_id = "ehr_event_modelling_new_celiac"
submission_path = "/workspace/submission/predictions.csv"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
network_mode = "no-network"
cpus = 1
memory_mb = 1024
storage_mb = 1024

[agent]
timeout_sec = 3600.0
# Agent phase: only the model APIs are reachable (Harbor egress-control sidecar,
# SNI/IP allowlist). Environment setup stays public so agent CLIs can install.
network_mode = "allowlist"
allowed_hosts = [
  "chatgpt.com", "*.chatgpt.com",
  "openai.com", "*.openai.com",
  "openai.azure.com", "*.openai.azure.com",
  "anthropic.com", "*.anthropic.com",
]

[environment]
build_timeout_sec = 1800.0
# Setup baseline is public; the agent phase is allowlisted (see [agent]).
network_mode = "public"
cpus = 16
memory_mb = 65536
# Bundle is ~17 GB extracted on the host (bind-mounted RO into bootstrap
# only, doesn't count here). The workspace-data named volume holds this
# task's sliced events.csv (~1-2 GB) plus pretrained model checkpoints,
# scratch features, intermediate parquet, etc. 64 GB leaves headroom for
# HuggingFace caches or large feature pickles.
storage_mb = 65536
# Default to CPU-only since the current host has no nvidia-docker runtime.
# Bump to ``gpus = 1`` when running on a GPU-capable host (Harbor will
# refuse to launch otherwise).
gpus = 0
mcp_servers = []

[verifier.env]

[solution.env]

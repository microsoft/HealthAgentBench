version = "1.0"
artifacts = ["/workspace/submission.json"]

[metadata]
benchmark = "radiology_report"
mode = "single-task"
description = "Correct a draft radiology report for the latest study in /data/patient/"
task_id = "xray_report_correction_case_09"
submission_path = "/workspace/submission.json"

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.com"]
cpus = 1
memory_mb = 1024
storage_mb = 1024

[agent]
timeout_sec = 3600.0
# Agent phase: only the model APIs are reachable (Harbor egress-control sidecar,
# SNI/IP allowlist). Environment setup stays public so agent CLIs can install.
network_mode = "allowlist"
allowed_hosts = [
  "chatgpt.com", "*.chatgpt.com",
  "openai.com", "*.openai.com",
  "openai.azure.com", "*.openai.azure.com",
  "anthropic.com", "*.anthropic.com",
]

[environment]
# Cold setup downloads the patient image history from PhysioNet. Large cases
# can take several hours on slow connections; cached setup finishes sooner.
build_timeout_sec = 21600.0
# Setup baseline is public; the agent phase is allowlisted (see [agent]).
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]
# Judge credentials, resolved from the host at run time (`set -a; source .env` or
# `harbor run --env-file .env`). Either the vanilla OpenAI or the Azure triple
# must be set; empty values are treated as unset by tests/harbor_evaluator.py.
# If you use Azure or a non-default base URL, also add that host to
# [verifier.environment].allowed_hosts above.
CHEXPROMPT_OPENAI_API_KEY = "${CHEXPROMPT_OPENAI_API_KEY:-}"
CHEXPROMPT_OPENAI_BASE_URL = "${CHEXPROMPT_OPENAI_BASE_URL:-https://api.openai.com/v1}"
CHEXPROMPT_AZURE_OPENAI_API_KEY = "${CHEXPROMPT_AZURE_OPENAI_API_KEY:-}"
CHEXPROMPT_AZURE_OPENAI_ENDPOINT = "${CHEXPROMPT_AZURE_OPENAI_ENDPOINT:-}"
CHEXPROMPT_AZURE_OPENAI_API_VERSION = "${CHEXPROMPT_AZURE_OPENAI_API_VERSION:-}"
CHEXPROMPT_DEPLOYMENT = "${CHEXPROMPT_DEPLOYMENT:-gpt-5.4}"

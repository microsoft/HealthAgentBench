version = "1.0"
artifacts = ["/workspace/submission.json"]

[metadata]
benchmark = "ehr_compositional_qa"
mode = "with_train"
question_set = "all"
question_count = 51
training_examples = 1020
submission_path = "/workspace/submission.json"

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 300.0
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024

[agent]
timeout_sec = 3600.0
# Agent phase: only the model APIs are reachable (Harbor egress-control sidecar,
# SNI/IP allowlist). Environment setup stays public so agent CLIs can install.
network_mode = "allowlist"
allowed_hosts = [
  "chatgpt.com", "*.chatgpt.com",
  "openai.com", "*.openai.com",
  "anthropic.com", "*.anthropic.com",
]

[environment]
build_timeout_sec = 3600.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 8192
gpus = 0
mcp_servers = []

[verifier.env]

[solution.env]

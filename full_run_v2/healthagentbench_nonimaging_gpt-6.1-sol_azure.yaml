jobs_dir: full_run_v2/codex_gpt-6.1-sol_azure
n_attempts: 1
n_concurrent_trials: 2
# Harbor apt-installs Node/npm during agent setup; the 6-minute default is too short here.
agent_setup_timeout_multiplier: 3
environment:
  type: docker
  delete: true
agents:
  - name: codex
    model_name: gpt-6.1-sol
    kwargs:
      reasoning_effort: xhigh
      web_search: disabled          # Codex hosted web tool off (-c web_search=disabled)
      config: full_run_v2/codex_azure_compact.toml   # early compaction: Azure rejects >50 images per request
datasets:
  - path: tasks
    task_names:
      - ehr_compositional_qa_aggregation
      - ehr_compositional_qa_all
      - ehr_compositional_qa_comparative
      - ehr_compositional_qa_derived
      - ehr_compositional_qa_direct
      - ehr_compositional_qa_temporal
      - ehr_data_quality_task_combined
      - ehr_data_quality_task_combined_hard
      - ehr_data_quality_task_demographic_conflict
      - ehr_data_quality_task_demographic_conflict_hard
      - ehr_data_quality_task_impossible_value
      - ehr_data_quality_task_impossible_value_hard
      - ehr_data_quality_task_inconsistency
      - ehr_data_quality_task_inconsistency_hard
      - ehr_event_modelling_new_acutemi
      - ehr_event_modelling_new_celiac
      - ehr_event_modelling_new_hyperlipidemia
      - ehr_event_modelling_new_hypertension
      - ehr_event_modelling_new_lupus
      - ehr_event_modelling_new_pancan
